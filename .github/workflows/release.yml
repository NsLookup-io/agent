# A tag v<version> releases it: goreleaser (.goreleaser.yaml) publishes the binaries, packages, checksums, SBOMs,
# install.sh and the image; then the Helm chart, at the same version, goes to oci://ghcr.io/nslookup-io/charts.
# Signatures are keyless: cosign signs as this workflow (GitHub's OIDC identity, hence id-token: write). The tests run
# first, in a job without write permissions.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # The tests run third-party code (the modules the agent uses): in a job of their own, with read access only.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Test
        run: |
          go vet ./...
          go test -race ./...
          sh scripts/check-chart.sh
          sh scripts/test-install.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tag that started this run. Left to itself goreleaser takes the highest tag on the commit, and git
          # sorts v1.0.0-rc.1 above v1.0.0, so a final release tagged on its release candidate's commit built the rc.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - name: Helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          helm package deploy/helm/agent --version "$version" --app-version "$version" --destination dist/chart
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/chart/agent-$version.tgz" oci://ghcr.io/nslookup-io/charts 2>&1 | tee dist/chart/push.log
          digest=$(awk '$1 == "Digest:" { print $2 }' dist/chart/push.log)
          case $digest in
            sha256:*) ;;
            *) echo "helm push printed no digest"; exit 1 ;;
          esac
          cosign sign --yes "ghcr.io/nslookup-io/charts/agent@$digest"
