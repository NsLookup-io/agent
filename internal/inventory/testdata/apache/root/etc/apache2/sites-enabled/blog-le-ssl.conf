<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName blog.example
	DocumentRoot /var/www/blog

SSLCertificateFile /etc/letsencrypt/live/blog.example/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/blog.example/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
