<IfModule mod_ssl.c>
	<VirtualHost *:443>
		ServerName shop.example
		ServerAlias www.shop.example
		ServerAdmin webmaster@shop.example
		DocumentRoot /var/www/html

		ErrorLog ${APACHE_LOG_DIR}/error.log
		CustomLog ${APACHE_LOG_DIR}/access.log combined

		#   SSL Engine Switch:
		#   Enable/Disable SSL for this virtual host.
		SSLEngine on

		#   A self-signed (snakeoil) certificate can be created by installing
		#   the ssl-cert package. See /usr/share/doc/apache2/README.Debian.gz
		SSLCertificateFile	/etc/ssl/shop/cert.pem
		SSLCertificateKeyFile "/etc/ssl/shop/privkey.pem"
		SSLCertificateChainFile /etc/ssl/shop/chain.pem

		<FilesMatch "\.(?:cgi|shtml|phtml|php)$">
			SSLOptions +StdEnvVars
		</FilesMatch>
		<Directory /usr/lib/cgi-bin>
			SSLOptions +StdEnvVars
		</Directory>
	</VirtualHost>
</IfModule>
