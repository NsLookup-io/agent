# renew_before_expiry = 30 days
version = 2.9.0
archive_dir = /etc/letsencrypt/archive/blog.example
cert = /etc/letsencrypt/live/blog.example/cert.pem
privkey = /etc/letsencrypt/live/blog.example/privkey.pem
chain = /etc/letsencrypt/live/blog.example/chain.pem
fullchain = /etc/letsencrypt/live/blog.example/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = 0123456789abcdef0123456789abcdef
authenticator = nginx
installer = nginx
server = https://acme-v02.api.letsencrypt.example/directory
key_type = ecdsa
