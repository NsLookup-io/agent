{{- /* The join code, used once: afterwards the agent keeps its own identity Secret, which this chart never touches. */ -}}
{{- if and .Values.joinCode (not .Values.existingJoinSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.fullname" . }}-join
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  joinCode: {{ .Values.joinCode | toString | quote }}
{{- end }}
